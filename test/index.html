    // ======================== 线性插值工具 ========================
    function linearScore(value, breakpoints, scores) {
        if (isNaN(value)) return 0;
        if (value <= breakpoints[0]) return scores[0];
        if (value >= breakpoints[breakpoints.length-1]) return scores[scores.length-1];
        for (let i = 0; i < breakpoints.length-1; i++) {
            if (value >= breakpoints[i] && value <= breakpoints[i+1]) {
                let ratio = (value - breakpoints[i]) / (breakpoints[i+1] - breakpoints[i]);
                return scores[i] + ratio * (scores[i+1] - scores[i]);
            }
        }
        return 0;
    }

    function linearScoreReversed(value, breakpoints, scores) {
        const revBreak = [...breakpoints].reverse();
        const revScores = [...scores].reverse();
        return linearScore(value, revBreak, revScores);
    }

            let newScore = last.score - extra * 10;
            return Math.max(0, newScore);
        }
        return 0;
    }
    function getFootballScore(gender) {
        const dian = parseFloat(document.getElementById('football_dianshu')?.value) || 0;
        const dingwei = parseFloat(document.getElementById('football_dingwei')?.value) || 0;
        const yunqiu = parseFloat(document.getElementById('football_yunqiu')?.value) || 0;
        const match = parseFloat(document.getElementById('football_match')?.value) || 0;
        const dianScore = getDribbleScore(dian);
        const dingweiScore = Math.min(30, Math.max(0, dingwei));
        const yunqiuScore = getDribbleShootScore(gender, yunqiu);
        const matchScore = Math.min(30, Math.max(0, match));
        return dianScore + dingweiScore + yunqiuScore + matchScore;
    }

    // ======================== 篮球专项评分 ========================

    const maleMogaoTable = [

    ];
    function getMogaoScore(gender, value) {
        const table = gender === 'male' ? maleMogaoTable : femaleMogaoTable;
        if (value >= table[0].min) return table[0].score;
        for (let item of table) {
            if (value >= item.min && value <= item.max) return item.score;
        }
        return 0;
    }
    // 往返运球投篮（秒，男/女）
    const maleWangfanTable = [
        { max: 30.0, score: 25.00 }, { val: 30.5, score: 23.75 }, { val: 31.0, score: 22.50 }, { val: 31.5, score: 21.25 },
        { val: 32.0, score: 20.25 }, { val: 32.5, score: 19.25 }, { val: 33.0, score: 18.25 }, { val: 33.5, score: 17.25 },
        { val: 34.0, score: 16.25 }, { val: 34.5, score: 15.50 }, { val: 35.0, score: 14.75 }, { val: 35.5, score: 14.00 },
        { val: 36.0, score: 13.25 }, { val: 36.5, score: 12.50 }, { val: 37.0, score: 12.00 }, { val: 37.5, score: 11.50 },

    ];
    const femaleWangfanTable = [
        { max: 35.0, score: 25.00 }, { val: 35.5, score: 23.75 }, { val: 36.0, score: 22.50 }, { val: 36.5, score: 21.25 },

        { val: 49.0, score: 5.00 }, { val: 49.5, score: 4.50 }, { val: 50.0, score: 4.00 }, { val: 50.5, score: 3.50 },
        { val: 51.0, score: 3.00 }, { val: 51.5, score: 2.50 }, { val: 52.0, score: 2.00 }
    ];
    function getWangfanScore(gender, seconds) {
        const table = gender === 'male' ? maleWangfanTable : femaleWangfanTable;
        if (seconds <= table[0].max) return table[0].score;
        for (let i = 0; i < table.length; i++) {
            const cur = table[i];
            if (cur.hasOwnProperty('val') && Math.abs(seconds - cur.val) < 0.0001) return cur.score;
            if (i > 0 && table[i-1].hasOwnProperty('val') && cur.hasOwnProperty('val')) {
                const prev = table[i-1];
                if (seconds > prev.val && seconds < cur.val) {
                    const ratio = (seconds - prev.val) / (cur.val - prev.val);
                    return prev.score + ratio * (cur.score - prev.score);
                }
            }
        }
        const last = table[table.length-1];
        if (seconds > last.val) {
            let extra = seconds - last.val;
            let newScore = last.score - extra * 10;
            return Math.max(0, newScore);
        }
        return 0;
    }
    // 一分钟投篮（个）
    const maleToulanTable = [
        { min: 8, max: Infinity, score: 25 }, { min: 7, max: 7, score: 21 }, { min: 6, max: 6, score: 18 },
        { min: 5, max: 5, score: 15 }, { min: 4, max: 4, score: 12 }, { min: 3, max: 3, score: 9 },
        { min: 2, max: 2, score: 6 }, { min: 1, max: 1, score: 3 }, { min: 0, max: 0, score: 0 }
    ];
    const femaleToulanTable = [
        { min: 7, max: Infinity, score: 25 }, { min: 6, max: 6, score: 21 }, { min: 5, max: 5, score: 17.5 },
        { min: 4, max: 4, score: 14 }, { min: 3, max: 3, score: 10.5 }, { min: 2, max: 2, score: 7 },
        { min: 1, max: 1, score: 3.5 }, { min: 0, max: 0, score: 0 }
    ];
    function getToulanScore(gender, count) {
        const table = gender === 'male' ? maleToulanTable : femaleToulanTable;
        for (let item of table) {
            if (count >= item.min && count <= item.max) return item.score;
        }
        return 0;
    }
    function getBasketballScore(gender) {
        const mogao = parseFloat(document.getElementById('basketball_mogao')?.value) || 0;
        const wangfan = parseFloat(document.getElementById('basketball_wangfan')?.value) || 0;
        const toulan = parseFloat(document.getElementById('basketball_toulan')?.value) || 0;
        const match = parseFloat(document.getElementById('basketball_match')?.value) || 0;
        const mogaoScore = getMogaoScore(gender, mogao);
        const wangfanScore = getWangfanScore(gender, wangfan);
        const toulanScore = getToulanScore(gender, toulan);
        const matchScore = Math.min(25, Math.max(0, match));
        return mogaoScore + wangfanScore + toulanScore + matchScore;
    }

    function getCultureValue(elemId) {
        let val = document.getElementById(elemId).value;
        if (val === "" || val === null) return 0;
        let num = parseFloat(val);
        return isNaN(num) ? 0 : num;
    }

    function showResult(containerId, sportTotal, cultureScore, detailItems, mode) {
        const cultureConvert = cultureScore / 7.5;
        const finalScore = sportTotal + cultureConvert;
        let html = `<div class="result-item"><span>体育总分</span><span class="result-value">${sportTotal.toFixed(2)}</span></div>`;
        if (mode === 'sport' && detailItems) {
            for (let item of detailItems) html += `<div class="result-item"><span>${item.name}</span><span class="result-value">${item.score.toFixed(2)}</span></div>`;
        }
        html += `<div class="result-item"><span>文化折算分 (文化/7.5)</span><span class="result-value">${cultureConvert.toFixed(2)}</span></div>
                 <div class="total-score"><div class="label">最终综合分</div><div class="value">${finalScore.toFixed(2)}</div></div>
                 <div class="subnote">* 体育分计算依据辽宁省官方评分标准，足球/篮球专项依据最新测试标准。</div>`;
        document.getElementById(containerId).innerHTML = html;
        document.getElementById(containerId).style.display = 'block';
    }

    function computeSportAndShow() {
        const gender = document.querySelector('input[name="gender"]:checked').value;
        const run = parseFloat(document.getElementById('run100').value);
        const jump = parseFloat(document.getElementById('tripleJump').value);
        const shot = parseFloat(document.getElementById('shotPut').value);
        const culture = getCultureValue('cultureScore');
        if (isNaN(run) || isNaN(jump) || isNaN(shot)) { alert("请完整填写所有成绩数值"); return; }
        let score100_raw = Math.min(100, Math.max(0, getQualityScore(gender, '100m', run)));
        let scoreJump_raw = Math.min(100, Math.max(0, getQualityScore(gender, 'tripleJump', jump)));
        let scoreShot_raw = Math.min(100, Math.max(0, getQualityScore(gender, 'shotPut', shot)));
        
        let specialScore_raw = 0;
        let specialDetailName = "";
        const event = specialSelect.value;
        if (event === 'football') {
            specialScore_raw = getFootballScore(gender);
            specialDetailName = "足球专项总分";
        } else if (event === 'basketball') {
            specialScore_raw = getBasketballScore(gender);
            specialDetailName = "篮球专项总分";
        } else {
            const specialRaw = parseFloat(document.getElementById('specialScore').value);
            if (isNaN(specialRaw)) { alert("请填写专项成绩"); return; }
            specialScore_raw = Math.min(100, Math.max(0, getSpecialScore(event, gender, specialRaw)));
            specialDetailName = `专项-${specialSelect.options[specialSelect.selectedIndex].text}`;
        }
        
        const score100_actual = score100_raw * 0.2;
        const scoreJump_actual = scoreJump_raw * 0.2;
        const scoreShot_actual = scoreShot_raw * 0.2;
        const special_actual = specialScore_raw * 0.4;
        const sportTotal = score100_actual + scoreJump_actual + scoreShot_actual + special_actual;
        
        const detailItems = [
            { name: `100米 (${run.toFixed(2)}秒)`, score: score100_actual },
            { name: `立定三级跳 (${jump.toFixed(2)}米)`, score: scoreJump_actual },
            { name: `铅球素质 (${shot.toFixed(2)}米)`, score: scoreShot_actual },
            { name: specialDetailName, score: special_actual }
        ];
        showResult('sportResult', sportTotal, culture, detailItems, 'sport');
    }

    function computeSimpleAndShow() {
        let sport = parseFloat(document.getElementById('simpleSportScore').value);
        let culture = getCultureValue('simpleCultureScore');
        if (isNaN(sport)) { alert("请填写有效的体育总分"); return; }
        sport = Math.min(100, Math.max(0, sport));
        showResult('simpleResult', sport, culture, null, 'simple');
    }

    document.getElementById('sportCalcBtn').addEventListener('click', computeSportAndShow);
    document.getElementById('simpleCalcBtn').addEventListener('click', computeSimpleAndShow);

    const specialSelect = document.getElementById('specialEvent');
    const specialLabel = document.getElementById('specialLabel');
    const specialUnitHint = document.getElementById('specialUnitHint');
    const simpleSpecialRow = document.getElementById('simpleSpecialRow');
    const dynamicContainer = document.getElementById('dynamicSpecialContainer');

    function updateSpecialUI() {
        const val = specialSelect.value;
        if (val === 'football') {
            simpleSpecialRow.style.display = 'none';
            dynamicContainer.innerHTML = `<div class="dynamic-input-group">
                <div class="input-row"><label>颠球 (个数)</label><input type="number" id="football_dianshu" step="1" value="50" placeholder="颠球次数"></div>
                <div class="input-row"><label>定位球传准总分 (0-30分)</label><input type="number" id="football_dingwei" step="0.5" value="18" placeholder="根据落点圈得分累加"></div>
                <div class="input-row"><label>20米运球过杆射门 (秒)</label><input type="number" id="football_yunqiu" step="0.1" value="10.5" placeholder="例: 10.5"></div>
                <div class="input-row"><label>比赛得分 (0-30分)</label><input type="number" id="football_match" step="0.5" value="22" placeholder="实战评分"></div>

            </div>`;
        } else if (val === 'basketball') {
            simpleSpecialRow.style.display = 'none';
            dynamicContainer.innerHTML = `<div class="dynamic-input-group">
                <div class="input-row"><label>助跑摸高 (米)</label><input type="number" id="basketball_mogao" step="0.01" value="3.10" placeholder="例: 3.10"></div>
                <div class="input-row"><label>往返运球投篮 (秒)</label><input type="number" id="basketball_wangfan" step="0.1" value="32.0" placeholder="例: 32.0"></div>
                <div class="input-row"><label>一分钟自投自抢投篮 (个)</label><input type="number" id="basketball_toulan" step="1" value="6" placeholder="命中个数"></div>
                <div class="input-row"><label>比赛得分 (0-25分)</label><input type="number" id="basketball_match" step="0.5" value="20" placeholder="实战评分"></div>
                <div class="inline-hint">※ 篮球专项满分100分 = 摸高(25) + 往返运球投篮(25) + 一分钟投篮(25) + 比赛(25)</div>
            </div>`;
        } else {
            simpleSpecialRow.style.display = 'flex';
            dynamicContainer.innerHTML = '';
            // 更新普通专项的标签提示
            if (val === '200m_e') { specialLabel.innerText = '200米成绩 (秒)'; specialUnitHint.innerText = '电计时，例: 23.84秒'; }
            else if (val === '400m_e') { specialLabel.innerText = '400米成绩 (秒)'; specialUnitHint.innerText = '电计时，例: 53.14秒'; }
            else if (val === '1500m') { specialLabel.innerText = '1500米成绩 (秒)'; specialUnitHint.innerText = '输入秒数，例如260秒=4分20秒'; }
            else if (val === '110mH_e') { specialLabel.innerText = '男子110米栏/女子100米栏 (秒)'; specialUnitHint.innerText = '电计时，例: 15.64秒 / 15.44秒'; }
            else if (val === 'shot_special') { specialLabel.innerText = '铅球专项 (米)'; specialUnitHint.innerText = '男子7.26kg/女子4kg (统一标准)'; }
            else if (val === 'discus') { specialLabel.innerText = '铁饼 (米)'; specialUnitHint.innerText = '男子2kg/女子1kg'; }
            else if (val === 'javelin') { specialLabel.innerText = '标枪 (米)'; specialUnitHint.innerText = '男子800g/女子600g'; }
            else if (val === 'highjump') { specialLabel.innerText = '跳高 (米)'; specialUnitHint.innerText = '例: 1.83'; }
            else if (val === 'longjump_special') { specialLabel.innerText = '跳远 (米)'; specialUnitHint.innerText = '例: 5.20 (女) / 6.50 (男)'; }
            else if (val === 'triplejump_special') { specialLabel.innerText = '三级跳远 (米)'; specialUnitHint.innerText = '例: 13.60'; }
            else if (val === 'swim_freestyle') { specialLabel.innerText = '100米自由泳 (秒)'; specialUnitHint.innerText = '例: 65.00'; }
            else { specialLabel.innerText = '专项成绩 (0-100分)'; specialUnitHint.innerText = '可直接输入专项得分(0~100)'; }
        }
    }

    specialSelect.addEventListener('change', updateSpecialUI);
    updateSpecialUI();

    const sportPanel = document.getElementById('sportPanel');
    const compPanel = document.getElementById('comprehensivePanel');
    const tabs = document.querySelectorAll('.tab');
    function setActiveTab(tabId) {
        if (tabId === 'sport') { sportPanel.classList.remove('hidden-panel'); compPanel.classList.add('hidden-panel'); } 
        else { sportPanel.classList.add('hidden-panel'); compPanel.classList.remove('hidden-panel'); }
        tabs.forEach(t => { if (t.getAttribute('data-tab') === tabId) t.classList.add('active'); else t.classList.remove('active'); });
        document.getElementById('sportResult').style.display = 'none';
        document.getElementById('simpleResult').style.display = 'none';
    }
    tabs.forEach(t => t.addEventListener('click', () => setActiveTab(t.getAttribute('data-tab'))));
    setActiveTab('sport');
</script>
